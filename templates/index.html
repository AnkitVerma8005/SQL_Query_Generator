<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPLYSQL</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>SIMPLYSQL</h1>
            <p>Generate SQL commands from natural language.</p>
        </header>

        <main>
            <div class="input-group">
                <textarea id="queryInput"
                    placeholder="Describe your SQL query here... (e.g., 'Show all users who signed up last week')"></textarea>
                <button id="generateBtn">Generate SQL</button>
            </div>

            <div id="resultContainer" class="hidden">
                <h2>Generated SQL:</h2>
                <div class="code-block">
                    <pre><code id="sqlOutput"></code></pre>
                    <button id="copyBtn" class="icon-btn" title="Copy to clipboard">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div id="errorContainer" class="hidden">
                <p id="errorMessage"></p>
            </div>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Generating...</p>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
